      \"RTM-88405\",\n  \"case\": {\n    \"shipment_id\": \"SH-4560\",\n    \"status\":
      \"on hold\",\n    \"hold_reason\": \"required document not received\"\n  },\n  \"required\":
      [\n    {\n      \"document\": \"bill of lading\",\n      \"received\": false\n    },\n    {\n      \"document\":
      \"commercial invoice\",\n      \"received\": true\n    }\n  ],\n  \"filings\":
      {\n    \"bill of lading\": {\n      \"document_id\": \"DOC-5711\",\n      \"uploaded\":
      \"Wednesday\",\n      \"filed_against_customs_case\": \"RTM-88410\"\n    },\n    \"commercial
      invoice\": {\n      \"document_id\": \"DOC-5712\",\n      \"uploaded\": \"Wednesday\",\n      \"filed_against_customs_case\":
      \"RTM-88405\"\n    }\n  },\n  \"other_cases\": {\n    \"RTM-88410\": {\n      \"shipment_id\":
      \"SH-4561\",\n      \"status\": \"cleared\",\n      \"hold_reason\": null\n    }\n  }\n}"}],"tool_choice":"auto","tools":[{"type":"function","function":{"name":"report_finding","description":"Report
