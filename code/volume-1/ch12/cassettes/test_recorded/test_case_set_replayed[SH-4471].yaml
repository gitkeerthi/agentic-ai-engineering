    body: '{"model":"deepseek-flash","stream":false,"messages":[{"role":"system","content":"You
      interpret the records Cobalt Freight''s procedure has gathered for one held\nshipment.\n\nThe
      message holds every record the procedure collected, as JSON: the shipment, its\ncustoms
      case, the documents the case requires, where each one is filed, and any other\ncustoms
      case a document is filed against.\nWork only from these records. Find what is
      holding the shipment and the action that\nwould fix it.\nIf the records can''t
      tell you, say so with status undetermined.\n\nCall report_finding once with
      your finding. Don''t answer in text.\n\nLimits:\n- Recommend actions; never
      claim to have taken one."},{"role":"user","content":"{\n  \"shipment_id\": \"SH-4471\",\n  \"shipment\":
      {\n    \"status\": \"held\",\n    \"location\": \"Rotterdam customs yard\",\n    \"contents\":
      \"industrial pumps\",\n    \"due\": \"Friday\",\n    \"customs_case\": \"RTM-88213\"\n  },\n  \"case_id\":
      \"RTM-88213\",\n  \"case\": {\n    \"shipment_id\": \"SH-4471\",\n    \"status\":
      \"on hold\",\n    \"hold_reason\": \"required document not received\"\n  },\n  \"required\":
      [\n    {\n      \"document\": \"bill of lading\",\n      \"received\": true\n    },\n    {\n      \"document\":
      \"commercial invoice\",\n      \"received\": false\n    },\n    {\n      \"document\":
      \"packing list\",\n      \"received\": true\n    }\n  ],\n  \"filings\": {\n    \"bill
      of lading\": {\n      \"document_id\": \"DOC-5529\",\n      \"uploaded\": \"Thursday\",\n      \"filed_against_customs_case\":
      \"RTM-88213\"\n    },\n    \"commercial invoice\": {\n      \"document_id\":
      \"DOC-5531\",\n      \"uploaded\": \"Thursday\",\n      \"filed_against_customs_case\":
      \"RTM-88124\"\n    },\n    \"packing list\": {\n      \"document_id\": \"DOC-5530\",\n      \"uploaded\":
      \"Thursday\",\n      \"filed_against_customs_case\": \"RTM-88213\"\n    }\n  },\n  \"other_cases\":
      {\n    \"RTM-88124\": {\n      \"shipment_id\": \"SH-4398\",\n      \"status\":
      \"cleared\",\n      \"hold_reason\": null\n    }\n  }\n}"}],"tool_choice":"auto","tools":[{"type":"function","function":{"name":"report_finding","description":"Report
      the finding to Cobalt''s case system.","parameters":{"$defs":{"Evidence":{"properties":{"record_id":{"description":"ID
      of the record that shows the fact","pattern":"^(SH-\\d{4}|RTM-\\d{5}|DOC-\\d{4})$","title":"Record
      Id","type":"string"},"fact":{"description":"What that record shows, in one sentence","title":"Fact","type":"string"}},"required":["record_id","fact"],"title":"Evidence","type":"object"},"Refiling":{"properties":{"document_id":{"description":"The
      misfiled document","pattern":"^DOC-\\d{4}$","title":"Document Id","type":"string"},"customs_case":{"description":"The
      customs case it should be filed against","pattern":"^RTM-\\d{5}$","title":"Customs
      Case","type":"string"}},"required":["document_id","customs_case"],"title":"Refiling","type":"object"}},"properties":{"shipment_id":{"pattern":"^SH-\\d{4}$","title":"Shipment
      Id","type":"string"},"status":{"description":"cause_found: the records show
      what is delaying it; nothing_wrong: the records show no problem; undetermined:
      the tools could not tell","enum":["cause_found","nothing_wrong","undetermined"],"title":"Status","type":"string"},"cause":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"One
      sentence; null unless status is cause_found","title":"Cause"},"evidence":{"description":"The
      facts that support the status, one per record","items":{"$ref":"#/$defs/Evidence"},"title":"Evidence","type":"array"},"recommended_action":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"One
      sentence for a person; null if nothing needs doing","title":"Recommended Action"},"refiling":{"anyOf":[{"$ref":"#/$defs/Refiling"},{"type":"null"}],"description":"Set
      only when the fix is to refile a misfiled document"}},"required":["shipment_id","status","cause","evidence","recommended_action","refiling"],"title":"Finding","type":"object"}}}],"thinking":{"type":"disabled"}}'
