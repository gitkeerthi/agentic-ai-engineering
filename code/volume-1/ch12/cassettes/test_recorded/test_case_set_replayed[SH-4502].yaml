    body: '{"model":"deepseek-flash","stream":false,"messages":[{"role":"system","content":"You
      interpret the records Cobalt Freight''s procedure has gathered for one held\nshipment.\n\nThe
      message holds every record the procedure collected, as JSON: the shipment, its\ncustoms
      case, the documents the case requires, where each one is filed, and any other\ncustoms
      case a document is filed against.\nWork only from these records. Find what is
      holding the shipment and the action that\nwould fix it.\nIf the records can''t
      tell you, say so with status undetermined.\n\nCall report_finding once with
      your finding. Don''t answer in text.\n\nLimits:\n- Recommend actions; never
      claim to have taken one."},{"role":"user","content":"{\n  \"shipment_id\": \"SH-4502\",\n  \"shipment\":
      {\n    \"status\": \"held\",\n    \"location\": \"Rotterdam customs yard\",\n    \"contents\":
      \"solar inverters\",\n    \"due\": \"Thursday\",\n    \"customs_case\": \"RTM-88301\"\n  },\n  \"case_id\":
      \"RTM-88301\",\n  \"case\": {\n    \"shipment_id\": \"SH-4502\",\n    \"status\":
      \"on hold\",\n    \"hold_reason\": \"required document not received\"\n  },\n  \"required\":
      [\n    {\n      \"document\": \"bill of lading\",\n      \"received\": true\n    },\n    {\n      \"document\":
      \"commercial invoice\",\n      \"received\": true\n    },\n    {\n      \"document\":
      \"packing list\",\n      \"received\": false\n    }\n  ],\n  \"filings\": {\n    \"bill
      of lading\": {\n      \"document_id\": \"DOC-5601\",\n      \"uploaded\": \"Monday\",\n      \"filed_against_customs_case\":
      \"RTM-88301\"\n    },\n    \"commercial invoice\": {\n      \"document_id\":
      \"DOC-5602\",\n      \"uploaded\": \"Monday\",\n      \"filed_against_customs_case\":
      \"RTM-88301\"\n    },\n    \"packing list\": {\n      \"found\": false,\n      \"message\":
      \"No packing list on file for SH-4502\"\n    }\n  },\n  \"other_cases\": {}\n}"}],"tool_choice":"auto","tools":[{"type":"function","function":{"name":"report_finding","description":"Report
      the finding to Cobalt''s case system.","parameters":{"$defs":{"Evidence":{"properties":{"record_id":{"description":"ID
      of the record that shows the fact","pattern":"^(SH-\\d{4}|RTM-\\d{5}|DOC-\\d{4})$","title":"Record
      Id","type":"string"},"fact":{"description":"What that record shows, in one sentence","title":"Fact","type":"string"}},"required":["record_id","fact"],"title":"Evidence","type":"object"},"Refiling":{"properties":{"document_id":{"description":"The
      misfiled document","pattern":"^DOC-\\d{4}$","title":"Document Id","type":"string"},"customs_case":{"description":"The
      customs case it should be filed against","pattern":"^RTM-\\d{5}$","title":"Customs
